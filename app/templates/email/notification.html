<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notification</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #fafafa;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        color: #1a1a1a;
        -webkit-font-smoothing: antialiased;
      }
      .wrapper {
        width: 100%;
        table-layout: fixed;
        background-color: #fafafa;
        padding-bottom: 40px;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border: 1px solid #e5e5e5;
        border-radius: 8px;
        overflow: hidden;
      }
      .header {
        padding: 32px 32px 20px 32px;
        border-bottom: 1px solid #f0f0f0;
      }
      .logo {
        font-size: 18px;
        font-weight: 700;
        color: #4f46e5;
        letter-spacing: -0.02em;
        text-transform: uppercase;
      }
      .content {
        padding: 32px;
        font-size: 15px;
        line-height: 1.6;
        color: #333333;
      }
      .salutation {
        font-weight: 600;
        margin-bottom: 16px;
      }
      .message-box {
        background-color: #f9fafb;
        border-left: 4px solid #4f46e5;
        padding: 16px 20px;
        margin: 24px 0;
        font-size: 15px;
        color: #1f2937;
        border-radius: 0 6px 6px 0;
      }
      .button-wrapper {
        margin-top: 32px;
      }
      .button {
        display: inline-block;
        padding: 12px 24px;
        background-color: #4f46e5;
        color: #ffffff !important;
        text-decoration: none;
        border-radius: 6px;
        font-weight: 600;
        font-size: 14px;
        text-align: center;
      }
      .footer {
        padding: 24px 32px;
        background-color: #fafafa;
        border-top: 1px solid #f0f0f0;
        font-size: 12px;
        color: #888888;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="container">
        <div class="header">
          <div class="logo">Ela Academy</div>
        </div>
        <div class="content">
          <div class="salutation">Hello,</div>
          <div class="message-box">
            {{ message | safe }}
          </div>
          {% if action_link %}
          <div class="button-wrapper">
            <a href="{{ action_link }}" class="button">View Details</a>
          </div>
          {% endif %}
        </div>
        <div class="footer">
          This is an automated notification from Ela Academy.
        </div>
      </div>
    </div>
  </body>
</html>
